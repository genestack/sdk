[tox]
envlist =
    py311
    py312
    py313
    py314
    py315
# The CI image carries one Python: run the environment it has, skip the rest. tox
# fails a missing interpreter unless told to skip it (the default changed in 4.56).
skip_missing_interpreters = true

[testenv]
deps=-r{toxinidir}/requirements.txt
     -r{toxinidir}/requirements-internal.txt
     -r{toxinidir}/requirements-test.txt
     -r{toxinidir}/requirements-build.txt

commands=
    pytest
